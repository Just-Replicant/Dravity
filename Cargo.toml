[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Just-Replicant/Dravity"
authors = ["Dravity contributors"]
keywords = ["bittorrent", "torrent", "p2p"]
categories = ["network-programming"]
publish = false

[workspace.dependencies]
# Internal crates
dravity-bencode = { path = "crates/dravity-bencode", version = "0.1.0" }
dravity-core = { path = "crates/dravity-core", version = "0.1.0" }
dravity-wire = { path = "crates/dravity-wire", version = "0.1.0" }
dravity-engine = { path = "crates/dravity-engine", version = "0.1.0" }
dravity-storage = { path = "crates/dravity-storage", version = "0.1.0" }
dravity-tracker = { path = "crates/dravity-tracker", version = "0.1.0" }
dravity-session = { path = "crates/dravity-session", version = "0.1.0" }
dravity-dht = { path = "crates/dravity-dht", version = "0.1.0" }
dravity-utp = { path = "crates/dravity-utp", version = "0.1.0" }
dravity-portmap = { path = "crates/dravity-portmap", version = "0.1.0" }
dravity-http = { path = "crates/dravity-http", version = "0.1.0" }

# External crates
anyhow = "1"
# HTTP API server (tokio + hyper); only the features the API uses.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
mainline = { version = "8", default-features = false, features = ["async"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Directory-relative `openat`/`O_NOFOLLOW` opens (storage path hardening).
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
# IPV6_V6ONLY listening sockets, so IPv4 and IPv6 can share a port.
socket2 = "0.6"
thiserror = "2"
tokio = "1"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
url = "2"

# Dev-only
# 0.8 needs Rust 1.86; keep within the MSRV.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.release]
debug = "line-tables-only"
