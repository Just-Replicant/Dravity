[package]
name = "dravity-mse"
description = "Message Stream Encryption (MSE/PE) for the Dravity BitTorrent engine: a sans-IO handshake plus an async stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["stream"]
# The async handshake and `MseStream` over Tokio I/O. Without it only the
# sans-IO handshake is built (used by the fuzz targets).
stream = ["dep:tokio"]

[dependencies]
getrandom.workspace = true
num-bigint.workspace = true
rc4.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[lints]
workspace = true
