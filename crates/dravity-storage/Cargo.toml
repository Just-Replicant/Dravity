[package]
name = "dravity-storage"
description = "Storage backends for the Dravity BitTorrent engine: filesystem with an FD cache and positional I/O, and in-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["filesystem", "network-programming"]
publish.workspace = true

[dependencies]
bytes.workspace = true
dravity-bencode.workspace = true
dravity-core.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { workspace = true, features = ["sync", "rt"], optional = true }
tokio-uring = { workspace = true, optional = true }

[features]
# io_uring file I/O (`UringIo`), Linux only; off by default.
uring = ["dep:tokio", "dep:tokio-uring"]

[dev-dependencies]
criterion.workspace = true
sha1.workspace = true
tempfile.workspace = true

[[bench]]
name = "file_io"
harness = false

[lints]
workspace = true
