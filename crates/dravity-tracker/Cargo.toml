[package]
name = "dravity-tracker"
description = "HTTP (BEP 3/23) and UDP (BEP 15) tracker announce for the Dravity BitTorrent engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["client"]
# The async `TrackerClient`. Without it only the sans-IO codecs are built
# (used by the fuzz targets).
client = [
    "dep:fastrand",
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio",
    "dep:url",
]

[dependencies]
dravity-bencode.workspace = true
dravity-core.workspace = true
fastrand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"], optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }

[[test]]
name = "client"
required-features = ["client"]

[lints]
workspace = true
