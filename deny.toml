# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list anticipates later phases (tokio, rustls, ...).
unused-allowed-license = "allow"
# Permissive dependency licenses only. GPL-family licenses are deliberately
# absent: Dravity itself is AGPL-3.0-or-later, and copyleft crates still need an
# explicit allow-list change.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Mozilla's CA certificate data (webpki-root-certs, pulled in by the
    # platform TLS verifier as a fallback root store). Permissive data license.
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Libraries use thiserror; anyhow is reserved for binaries (see docs/).
    { crate = "anyhow", wrappers = ["dravity-cli"] },
    # OpenSSL is avoided in favour of rustls (see plan, section 5).
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
