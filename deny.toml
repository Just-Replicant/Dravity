# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list anticipates later phases (tokio, rustls, ...).
unused-allowed-license = "allow"
# Permissive licenses only. GPL-family licenses are deliberately absent:
# Dravity is MIT OR Apache-2.0 and must never depend on copyleft code.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Libraries use thiserror; anyhow is reserved for binaries (see docs/).
    { crate = "anyhow", wrappers = [] },
    # OpenSSL is avoided in favour of rustls (see plan, section 5).
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
